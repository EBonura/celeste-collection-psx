name: Deploy to itch.io

on:
  push:
    branches: [main]
    paths:
      - "release/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after validating the package
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: itch-celeste-collection-psx
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version and disc package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          crate_version="$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' games/celeste-collection/Cargo.toml)"
          [[ "${version}" == "${crate_version}" ]] || {
            echo "VERSION ${version} does not match collection Cargo.toml ${crate_version}" >&2
            exit 1
          }
          grep -Fq "v${version}" release/README.txt || {
            echo "release/README.txt does not identify v${version}" >&2
            exit 1
          }
          mapfile -t cues < <(find release -maxdepth 1 -type f -name '*.cue' -print)
          [[ "${#cues[@]}" -eq 1 ]] || {
            echo "release must contain exactly one CUE" >&2
            exit 1
          }
          bin_name="$(awk -F'"' '/^FILE /{print $2; exit}' "${cues[0]}")"
          [[ -n "${bin_name}" && -f "release/${bin_name}" ]] || {
            echo "${cues[0]} references a missing BIN: ${bin_name}" >&2
            exit 1
          }
          [[ "$(grep -c '^[[:space:]]*TRACK ' "${cues[0]}")" -eq 1 ]] || {
            echo "Celeste Collection release must contain exactly one data track" >&2
            exit 1
          }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Retain the verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: celeste-collection-psx-${{ steps.package.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Validate destination and optionally publish
        uses: EBonura/PSoXide/.github/actions/itch-publish@7f989e2580df66fe824c2853dfe3722ae2c1bb58
        with:
          source-dir: release
          target: bonnie-studios/celeste-classic-collection-psx:psx
          user-version: ${{ steps.package.outputs.version }}
          publish: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
