# The Celeste Classic Collection's test description for psoxide-test (the SDK's harness,
# tools/psoxide-test). It declares what to build and check; the harness decides how.
# Baseline: psoxide-test.baseline.toml.
schema = 1
name = "Celeste Classic Collection"
repository = "EBonura/celeste-collection-psx"

# The shipping disc (what the library gets): no state receipts linked.
[[build]]
name = "ship"
out = "build/ship"
commands = [["make", "collection-disc"]]
collect = { "celeste-collection.bin" = "dist/celeste-collection.bin", "celeste-collection.cue" = "dist/celeste-collection.cue", "celeste-collection.map" = "dist/celeste-collection.map", "celeste-collection.exe" = "games/celeste-collection/target/mipsel-sony-psx/release/celeste-collection.exe" }
disc = "celeste-collection.cue"
map = "celeste-collection.map"

# The journeys' disc: the same collection with the result receipts (CELESTE_JOURNEY, LANI_JOURNEY,
# SHELL_PHASE), pressed with --diag. Built second: it overwrites the cargo target of the shipping exe.
[[build]]
name = "gate"
out = "build/gate"
commands = [["make", "collection-gate"]]
collect = { "celeste-collection.bin" = "dist/gate/celeste-collection.bin", "celeste-collection.cue" = "dist/gate/celeste-collection.cue", "celeste-collection.map" = "dist/gate/celeste-collection.map", "celeste-collection.exe" = "games/celeste-collection/target/mipsel-sony-psx/release/celeste-collection.exe" }
disc = "celeste-collection.cue"
map = "celeste-collection.map"

[[size]]
build = "ship"

[journeys]
files = "tests/*.toml"
# The old gate ran every journey on the hardware renderer too (--strict, real and mister).
hw = true
precheck = ["cart-reset", "smoke-boot-play", "scene-hops"]

[cross]
smoke = ["tests/smoke-boot-play.toml"]
# The shipping disc has no receipts: it must boot and present with no input on every emulator.
boot = { build = "ship", frames = 3000 }

[[host]]
name = "fmt-check"
command = ["make", "fmt-check"]

[[host]]
name = "no64"
command = ["make", "no64"]

# Load-delay hazards in guest asm (fleet rule since SDK 580daa02), with the pin's own scanner.
[[host]]
name = "check-mfc0"
command = ["cargo", "run", "-q", "--release", "--locked", "--manifest-path", ".psoxide/tools/psoxide-hazard/Cargo.toml", "--bin", "check-mfc0", "--", "shared", "games"]

[[host]]
# The two synthesisers keep their state in statics: the tests must not overlap.
name = "synth-ab"
command = ["cargo", "test", "-q", "--manifest-path", "tools/synth-ab/Cargo.toml", "--", "--test-threads=1"]

[[host]]
name = "settings-test"
command = ["cargo", "test", "-q", "--manifest-path", "tools/settings-test/Cargo.toml"]

[clean]
build = "ship"
seed = [".psoxide"]
compare = ["celeste-collection.bin", "celeste-collection.cue", "celeste-collection.exe"]

[[install]]
build = "ship"
name = "Celeste Classic Collection"

# One window on the poll-bound tape pgo/classic.pxtape (tools/speed-tape.py): splash skip, menu launch,
# title start, then Classic play. Polls 2800..6000 are gameplay (rooms 1 and 2 with deaths and respawns).
[[speed]]
name = "classic"
build = "ship"
tape = "pgo/classic.pxtape"
polls = [2800, 6000]
offsets = [-48, -36, -24, -12, 0, 12, 24, 36]

# Load time on the gate disc (it carries the receipts the conditions name), one replay per row of the
# poll-bound tape pgo/loads.pxtape: splash skip, Classic launched and quit with Select+Start, Lani
# highlighted, launched and quit. Every scene is in the one resident image, so a switch reads no
# disc. SCENE_BLOCK + 0x14 is the current scene (0 menu, 1 Classic, 2 Lani), + 0x16 the previous
# one, + 0x81 the menu's highlighted cart (CORE-ABI.md section 2).
[[load]]
name = "boot-to-splash"
build = "gate"
until = { kind = "ram", sym = "SHELL_PHASE", op = "eq", value = 1 }
max_polls = 200

[[load]]
name = "boot-to-menu"
build = "gate"
tape = "pgo/loads.pxtape"
launch_args = ["--dualshock-pad"]
until = { kind = "ram", sym = "SHELL_PHASE", op = "eq", value = 2 }
max_polls = 400

[[load]]
name = "menu-to-classic"
build = "gate"
tape = "pgo/loads.pxtape"
launch_args = ["--dualshock-pad"]
from = [{ kind = "ram", sym = "SCENE_BLOCK", offset = 0x14, size = 2, op = "eq", value = 0 }, { kind = "ram", sym = "SHELL_PHASE", op = "eq", value = 3 }]
until = [{ kind = "ram", sym = "SCENE_BLOCK", offset = 0x14, size = 2, op = "eq", value = 1 }, { kind = "ram", sym = "CELESTE_JOURNEY", offset = 80, op = "eq", value = 1 }]
max_polls = 700

[[load]]
name = "classic-to-menu"
build = "gate"
tape = "pgo/loads.pxtape"
launch_args = ["--dualshock-pad"]
from = [{ kind = "ram", sym = "SCENE_BLOCK", offset = 0x14, size = 2, op = "eq", value = 0 }, { kind = "ram", sym = "SCENE_BLOCK", offset = 0x16, size = 2, op = "eq", value = 1 }]
until = [{ kind = "ram", sym = "SCENE_BLOCK", offset = 0x14, size = 2, op = "eq", value = 0 }, { kind = "ram", sym = "SCENE_BLOCK", offset = 0x16, size = 2, op = "eq", value = 1 }, { kind = "ram", sym = "SHELL_PHASE", op = "eq", value = 2 }]
max_polls = 1000

[[load]]
name = "menu-to-lani"
build = "gate"
tape = "pgo/loads.pxtape"
launch_args = ["--dualshock-pad"]
from = [{ kind = "ram", sym = "SCENE_BLOCK", offset = 0x14, size = 2, op = "eq", value = 0 }, { kind = "ram", sym = "SCENE_BLOCK", offset = 0x81, size = 1, op = "eq", value = 1 }, { kind = "ram", sym = "SHELL_PHASE", op = "eq", value = 3 }]
until = [{ kind = "ram", sym = "SCENE_BLOCK", offset = 0x14, size = 2, op = "eq", value = 2 }, { kind = "ram", sym = "LANI_JOURNEY", offset = 80, op = "eq", value = 1 }]
max_polls = 1200

[[load]]
name = "lani-to-menu"
build = "gate"
tape = "pgo/loads.pxtape"
launch_args = ["--dualshock-pad"]
from = [{ kind = "ram", sym = "SCENE_BLOCK", offset = 0x14, size = 2, op = "eq", value = 0 }, { kind = "ram", sym = "SCENE_BLOCK", offset = 0x16, size = 2, op = "eq", value = 2 }]
until = [{ kind = "ram", sym = "SCENE_BLOCK", offset = 0x14, size = 2, op = "eq", value = 0 }, { kind = "ram", sym = "SCENE_BLOCK", offset = 0x16, size = 2, op = "eq", value = 2 }, { kind = "ram", sym = "SHELL_PHASE", op = "eq", value = 2 }]
max_polls = 1500
