name: host check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SDK hydration pin consistency
        run: python3 tools/test_sdk_pin.py
      - name: Check GPU linked-list packing
        run: python3 tools/test_gpu_list_contract.py
      - name: Install the pinned nightly
        run: |
          rustup toolchain install nightly-2026-03-25 --component rust-src
          rustup default nightly-2026-03-25
      - name: Check Classic object removal lifecycle
        run: python3 tools/test_classic_object_prefix.py
        run: python3 tools/test_grapple_candidates.py
      - name: Check circle visibility against existing raster spans
        run: python3 tools/test_disc_visibility.py
      - name: Check deferred circle packets against the frozen transform
        run: python3 tools/test_disc_packets.py
      - name: Hydrate the pinned PSoXide dependencies
        run: make psoxide
      - name: Check shared/ for the host target
        run: |
          HOST=$(rustc -vV | sed -n 's/host: //p')
          cargo check --manifest-path shared/Cargo.toml --target "$HOST"
