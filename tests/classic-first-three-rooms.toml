kind = "ram"
sym = "CELESTE_JOURNEY"
op = "eq"
value = 1
each = { count = 2, stride = 4 }
note = "version 1 Classic observation ABI"
[[step.assert]]
kind = "ram"
sym = "CELESTE_JOURNEY"
offset = 24
op = "eq"
value = 1
