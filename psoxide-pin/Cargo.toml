# Which PSoXide this game is built against. Cargo owns the pin: the rev below
# goes into psoxide-pin/Cargo.lock and Cargo caches that checkout once per
# machine rather than once per game.
#
# `make` runs this crate, and psoxide_link::hydrate_pinned copies the checkout
# Cargo compiled it from into ../.psoxide, so the game's plain path
# dependencies and the linker script both resolve. Nothing here points into
# .psoxide -- a pin that did could not be read before that tree existed, which
# is the whole reason a clean clone works.
#
# To move the SDK: change rev here, `cargo update -p psoxide-link` in this
# directory, then `make psoxide`.
[package]
name    = "psoxide-pin"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
psoxide-link = { git = "https://github.com/EBonura/PSoXide.git", rev = "0fb88fe15c2c82eab2b6ebb5ce93fe4b070eb92c" }
