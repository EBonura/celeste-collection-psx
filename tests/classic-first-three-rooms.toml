hold = 8

[[step]]
label = "normal input frames 456 through 463"
wait = 8

[[step]]
label = "normal input frames 464 through 471"
press = ["left", "circle"]
hold = 8

[[step]]
label = "normal input frames 472 through 487"
press = ["cross"]
hold = 16

[[step]]
label = "normal input frames 488 through 495"
press = ["right", "up", "circle"]
hold = 8

[[step]]
label = "normal input frames 496 through 503"
wait = 8

[[step]]
label = "normal input frames 504 through 511"
press = ["right", "circle"]
hold = 8

[[step]]
label = "settle on the upper ledge before the exit jump"
