name = "celeste-classic-rooms-0-through-2"
title = "Classic title through normal room 2 exit"
disc = ["dist/celeste-collection.cue"]
symbols = ["dist/celeste-collection.map"]
max_ticks = 2400

[[step]]
label = "skip collection introduction"
wait = 60


[[step]]
press = ["cross"]
hold = 8
wait = 100


[[step]]
label = "launch Classic"
press = ["cross"]
hold = 8
wait = 230


[[step]]
label = "start through Classic title"
press = ["cross"]
hold = 8


[[step]]
wait_until = { kind = "ram", sym = "CELESTE_JOURNEY", offset = 20, signed = true, op = "eq", value = 0 }
timeout = 800


[[step]]
wait_until = { kind = "ram", sym = "CELESTE_JOURNEY", offset = 24, op = "eq", value = 1 }
timeout = 400


