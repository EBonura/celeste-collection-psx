# `trim-paths` is a nightly cargo feature; these crates are nightly-pinned
# anyway (bare-metal MIPS needs build-std), so the gate costs nothing.
cargo-features = ["trim-paths"]

[package]
name    = "celeste-collection"
version = "0.2.9"
edition = "2021"

# Stand-alone workspace root, like the individual game crates. The
# collection is the headline artifact: one boot EXE that shows a cover
# menu and launches either game (both linked in as libraries).
[workspace]

[[bin]]
name = "celeste-collection"
path = "src/main.rs"

[profile.release]
# Keep absolute host paths out of the shipped binary. rustc records the
# source path of every panic/assert site (core::panic::Location) as a
# string in .rodata, which on the PS1 means the developer's home directory
# occupies console RAM and ships on the public disc image.
trim-paths    = "all"
# no_std has no unwinder; abort keeps the binary small.
panic         = "abort"
codegen-units = 1
# Fat LTO: measured against thin on this build, 4.5% less work per tick (Celeste 1 -4.7%,
# Celeste 2 -6.4%, menu -1.8%) and 1,432 B smaller text. The one visible effect is that the Celeste 1
# title flash starts one vblank later on one emulator (the game's update count at start-up moves by one).
# Fat once dropped both carts' `run` chains from this image; `make collection` now fails if the link
# map lacks a function of each cart (see COLLECTION_PRESENT).
lto           = true

[features]
# The journeys' result receipts of both carts: the gate disc has them, a shipping build links none.
receipts = ["celeste/receipts", "celeste2/receipts"]

[dependencies]
# The two games, linked in as libraries; the launcher calls their
# `run()` entry points and they return on Select+Start.
celeste  = { path = "../celeste" }
celeste2 = { path = "../celeste2" }

# Shared PICO-8 runtime, for the menu's sound effects (sfx::init/play/update),
# driven off celeste's sound bank (celeste::AUDIO).
pico8 = { path = "../../shared" }

# PSoXide SDK, pulled from the pinned submodule via path deps.
psx-rt   = { path = "../../.psoxide/sdk/crates/psx-rt" }
psx-gpu  = { path = "../../.psoxide/sdk/crates/psx-gpu" }
psx-io   = { path = "../../.psoxide/sdk/crates/psx-io" }
psx-splash = { path = "../../.psoxide/sdk/crates/psx-splash" }
psx-vram = { path = "../../.psoxide/sdk/crates/psx-vram" }
psx-pad  = { path = "../../.psoxide/sdk/crates/psx-pad" }
psx-font = { path = "../../.psoxide/sdk/crates/psx-font" }
# The scene core, from the pinned SDK: its image, `__core_boot` and the calls.
psx-core = { path = "../../.psoxide/sdk/crates/psx-core", features = ["link"] }
psx-scene-abi = { path = "../../.psoxide/sdk/crates/psx-scene-abi" }
