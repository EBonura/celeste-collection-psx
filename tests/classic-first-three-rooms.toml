timeout = 500

[[step]]
sync = "poll"
label = "wait for the next room's player to appear"
wait_until = { kind = "ram", sym = "CELESTE_JOURNEY", offset = 24, op = "eq", value = 1 }
timeout = 400

[[step]]
sync = "poll"
label = "wait for the player to land on the spawn height"
wait_until = { kind = "ram", sym = "CELESTE_JOURNEY", offset = 32, signed = true, op = "eq", value = 7340032 }
timeout = 400

[[step]]
checkpoint = "room-0-exit-room-1-entry"
golden = false
[[step.assert]]
kind = "ram"
sym = "CELESTE_JOURNEY"
offset = 80
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "CELESTE_JOURNEY"
