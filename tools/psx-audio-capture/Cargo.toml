[package]
name = "psx-audio-capture"
version = "0.1.0"
edition = "2021"

# Standalone host tool (builds for the host, NOT the mipsel PSX target).
# Path-deps the emulator crates from the tree `make emulator` clones and
# bootstraps (.psoxide-emulator, pinned in the Makefile); cargo resolves their
# workspace-inherited deps from that tree's own workspace root. psx-iso comes
# from the same tree so its `Disc` type is the one emulator-core takes.
[workspace]

[[bin]]
name = "psx-audio-capture"
path = "src/main.rs"

[[bin]]
name = "frametest"
path = "src/bin/frametest.rs"

[dependencies]
emulator-core    = { path = "../../.psoxide-emulator/emu/crates/emulator-core" }
psoxide-settings = { path = "../../.psoxide-emulator/emu/crates/psoxide-settings" }
psx-iso          = { path = "../../.psoxide-emulator/crates/psx-iso" }
