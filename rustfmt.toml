# Google's Rust style guide, as set out in PSoXide's sdk/docs/STYLE.md. Three of these options are
# unstable, which is why rust-toolchain.toml pins a nightly and this file opts in.
unstable_features = true
max_width = 100
hex_literal_case = "Lower"
format_macro_matchers = true
imports_granularity = "Module"

# Generated or vendored: not ours to format.
ignore = ["games/celeste-collection/src/assets/cover_bonnie.rs", "games/celeste-collection/src/assets/cover_celeste.rs", "games/celeste-collection/src/assets/cover_celeste2.rs", "games/celeste/src/assets/audio_data.rs", "games/celeste/src/assets/gfx.rs", "games/celeste/src/assets/tilemap.rs", "games/celeste2/src/assets/audio_data.rs", "games/celeste2/src/assets/gfx.rs", "games/celeste2/src/assets/levels.rs", "games/celeste2/src/assets/tilemap.rs", "shared/src/font.rs", "shared/src/icons_data.rs", "shared/src/menu_sfx_data.rs", "shared/src/palette.rs", "shared/src/sin_table.rs"]
