# Build this crate for the PlayStation 1 by default, so a plain
# `cargo build --release` inside this directory produces the PSX rlib.
#
# This config lives under the shared crate (not the repo root) on
# purpose: it must NOT leak onto the host tools (mkisopsx) that the
# Makefile builds from inside the PSoXide submodule.
[build]
target = "mipsel-sony-psx"

[unstable]
# No prebuilt std for the PSX target: compile core ourselves, with the
# memcpy/memset shims compiler-builtins needs on bare metal.
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]

[target.mipsel-sony-psx]
# LLVM's MIPS delay-slot filler hoists loads into branch delay slots without
# re-checking the R3000 load-delay hazard, so the next instruction on either
# path can read the stale register. The backward search is the one that does
# it; PSoXide's own guest build carries the same flag.
rustflags = ["-C", "llvm-args=-disable-mips-df-backward-search"]
