timeout = 60

[[step]]
wait = 2

[[step]]
label = "normal input frames 512 through 519"
press = ["right", "cross"]
hold = 8

[[step]]
label = "normal input frames 520 through 527"
press = ["right", "up", "cross", "circle"]
hold = 8

[[step]]
label = "normal input frames 528 through 535"
wait = 8

[[step]]
label = "wait for normal top edge exit"
